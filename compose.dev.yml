# Development only. Production should use authenticated MongoDB with TLS and backups.
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--nounixsocket"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - jeweller-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) }'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  jeweller-mongo:
